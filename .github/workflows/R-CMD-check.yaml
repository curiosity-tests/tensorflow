on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '21 3 * * Fri'

name: R-CMD-check

defaults:
  run:
    shell: Rscript {0}

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "R-CMD-check ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  R-CMD-check:
    name: ${{ matrix.os }}, tf-${{ matrix.tf }}, R-${{ matrix.r}}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:

          ## the happy path - default everything
          - {os: 'ubuntu-latest' , tf: 'default', r: 'release'}
          - {os: 'ubuntu-latest' , tf: 'default', r: 'oldrel'}
          - {os: 'ubuntu-latest' , tf: 'default', r: 'oldrel-1'}
          - {os: 'ubuntu-latest' , tf: 'default', r: 'oldrel-2'}
          - {os: 'ubuntu-latest' , tf: 'default', r: 'oldrel-3'}

          ## release keras/tf version (if different from 'default')
          # - {os: 'ubuntu-latest' , tf: 'release', r: 'release'}
          # - {os: 'windows-latest', tf: 'release', r: 'release'}
          # - {os: 'macOS-latest'  , tf: 'release', r: 'release'}

          ## old keras/tf versions
          # - {os: 'ubuntu-latest', tf: '2.18', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.17', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.16', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.15', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.14', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.13', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.12', r: 'release'}

          # these are allowed to fail
          # - {os: 'ubuntu-latest', tf: '2.14.0rc1', r: 'release'}
          # - {os: 'ubuntu-20.04', tf: 'default', r: 'devel'}
          # - {os: 'ubuntu-20.04', tf: 'nightly' , r: 'release'}

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.tf == 'nightly' || contains(matrix.tf, 'rc') || matrix.r == 'devel' }}
    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PY_REQUIRE_TENSORFLOW: true
      # R_REMOTES_NO_ERRORS_FROM_WARNINGS: 'true'
      # R_COMPILE_AND_INSTALL_PACKAGES: 'never'

    steps:

      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
          Ncpus: '2L'

      # - name: Get Date
      #   id: get-date
      #   shell: bash
      #   run: |
      #     echo "::set-output name=year-week::$(date -u "+%Y-%U")"
      #     echo "::set-output name=date::$(date -u "+%F")"
      #
      # - name: Restore R package cache
      #   uses: actions/cache@v2
      #   id: r-package-cache
      #   with:
      #     path: ${{ env.R_LIBS_USER }}
      #     key: ${{ matrix.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ steps.get-date.outputs.year-week }}-2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck local::.
            # rstudio/reticulate
          cache-version: 5
          upgrade: 'TRUE'

      # - name: Install TensorFlow
      #   run: |
      #     print(sessionInfo())
      #     print(Sys.info())
      #     version <- '${{ matrix.tf }}'
      #     if (version != "default")
      #       tensorflow::install_tensorflow(version = '${{ matrix.tf }}')
      #     tensorflow::tf_config()

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
