on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '21 3 * * Fri'

name: R-CMD-check

defaults:
  run:
    shell: Rscript {0}

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "R-CMD-check ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  R-CMD-check:
    name: ${{ matrix.os }}, tf-${{ matrix.tf }}, R-${{ matrix.r}}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:

          ## the happy path - default everything
        - {os: 'ubuntu-latest', tf: 'default', r: 'release'}
        - {os: 'ubuntu-latest', tf: 'default', r: 'oldrel'}
        - {os: 'ubuntu-latest', tf: 'default', r: 'oldrel-1'}
        - {os: 'ubuntu-latest', tf: 'default', r: 'oldrel-2'}
        - {os: 'ubuntu-latest', tf: 'default', r: 'oldrel-3'}

          ## release keras/tf version (if different from 'default')
          # - {os: 'ubuntu-latest' , tf: 'release', r: 'release'}
          # - {os: 'windows-latest', tf: 'release', r: 'release'}
          # - {os: 'macOS-latest'  , tf: 'release', r: 'release'}

          ## old keras/tf versions
          # - {os: 'ubuntu-latest', tf: '2.18', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.17', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.16', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.15', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.14', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.13', r: 'release'}
          # - {os: 'ubuntu-latest', tf: '2.12', r: 'release'}

          # these are allowed to fail
          # - {os: 'ubuntu-latest', tf: '2.14.0rc1', r: 'release'}
          # - {os: 'ubuntu-20.04', tf: 'default', r: 'devel'}
          # - {os: 'ubuntu-20.04', tf: 'nightly' , r: 'release'}

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.tf == 'nightly' || contains(matrix.tf, 'rc') || matrix.r == 'devel' }}
    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PY_REQUIRE_TENSORFLOW: true
      # R_REMOTES_NO_ERRORS_FROM_WARNINGS: 'true'
      # R_COMPILE_AND_INSTALL_PACKAGES: 'never'

    steps:

    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r@v2
      id: setup-r
      with:
        r-version: ${{ matrix.r }}
        use-public-rspm: true
        Ncpus: '2L'

      # - name: Get Date
      #   id: get-date
      #   shell: bash
      #   run: |
      #     echo "::set-output name=year-week::$(date -u "+%Y-%U")"
      #     echo "::set-output name=date::$(date -u "+%F")"
      #
      # - name: Restore R package cache
      #   uses: actions/cache@v2
      #   id: r-package-cache
      #   with:
      #     path: ${{ env.R_LIBS_USER }}
      #     key: ${{ matrix.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ steps.get-date.outputs.year-week }}-2

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::rcmdcheck local::.
            # rstudio/reticulate
        cache-version: 5
        upgrade: 'TRUE'

      # - name: Install TensorFlow
      #   run: |
      #     print(sessionInfo())
      #     print(Sys.info())
      #     version <- '${{ matrix.tf }}'
      #     if (version != "default")
      #       tensorflow::install_tensorflow(version = '${{ matrix.tf }}')
      #     tensorflow::tf_config()

    - uses: r-lib/actions/check-r-package@v2
      with:
        upload-snapshots: true
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
